<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Protect your ears from sudden browser audio peaks</title>
  <desc id="desc">Promotional illustration of a waveform with loud peaks being smoothly limited.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111820"/><stop offset="1" stop-color="#27332f"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d49b3c"/><stop offset="1" stop-color="#f4cd7b"/></linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif">
    <text x="84" y="118" font-size="17" letter-spacing="4" fill="#e0ae52">HEARING PROTECTION FOR THE WEB</text>
    <text x="80" y="208" font-size="55" font-weight="700" fill="#f5f2ea">No more sudden</text>
    <text x="80" y="273" font-size="55" font-weight="700" fill="#f5f2ea">volume shocks.</text>
    <text x="84" y="322" font-size="20" fill="#aeb8b9">A transparent limiter keeps every tab at a comfortable level.</text>
  </g>
  <g transform="translate(80 405)">
    <rect width="1120" height="200" rx="14" fill="#11171d" stroke="#3b474b"/>
    <text x="28" y="39" font-family="Arial" font-size="12" letter-spacing="2" fill="#89969a">RAW AUDIO PEAKS</text>
    <text x="28" y="178" font-family="Arial" font-size="12" letter-spacing="2" fill="#89969a">LIMITED OUTPUT</text>
    <path d="M28 78h1050 M28 138h1050" stroke="#354149" stroke-dasharray="4 8"/>
    <path d="M28 78 C65 78 68 78 88 78 S112 30 130 78 S153 -15 170 78 S190 53 215 78 S245 75 270 78 S300 -2 320 78 S350 62 374 78 S410 78 438 78 S466 24 482 78 S510 -28 528 78 S554 55 580 78 S615 78 645 78 S680 3 694 78 S720 48 745 78 S780 78 808 78 S834 16 850 78 S880 51 902 78 S940 78 968 78 S998 7 1012 78 S1035 50 1078 78" fill="none" stroke="#e35e57" stroke-width="5" stroke-linecap="round"/>
    <path d="M28 138 C75 138 75 138 110 138 S145 118 170 138 S205 130 230 138 S270 138 310 138 S345 119 375 138 S410 130 440 138 S480 138 525 138 S560 120 585 138 S620 130 650 138 S700 138 745 138 S780 118 810 138 S850 130 880 138 S925 138 965 138 S1000 120 1020 138 S1050 130 1078 138" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
    <line x1="28" y1="95" x2="1078" y2="95" stroke="#d49b3c" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="1045" y="87" font-family="Arial" font-size="11" fill="#e0ae52" text-anchor="end">-20 dBFS LIMIT</text>
  </g>
</svg>
