<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
  <title id="title">Decibel Limiter promotional mosaic</title>
  <desc id="desc">Compact promotional artwork showing calm browser audio controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111820"/><stop offset="1" stop-color="#27332f"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d59c3f"/><stop offset="1" stop-color="#f1c46b"/></linearGradient>
  </defs>
  <rect width="440" height="280" fill="url(#bg)"/>
  <path d="M0 230 C55 205 82 255 138 228 S220 198 276 232 S370 258 440 218" fill="none" stroke="#d9a449" stroke-width="1" opacity=".35"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="43" font-size="9" letter-spacing="2" fill="#e2b35a">DECIBEL LIMITER</text>
    <text x="22" y="88" font-size="25" font-weight="700" fill="#f5f2ea">Audio under</text>
    <text x="22" y="117" font-size="25" font-weight="700" fill="#f5f2ea">control.</text>
    <text x="24" y="143" font-size="10" fill="#aeb8b9">No sudden volume jumps.</text>
  </g>
  <g transform="translate(258 24)">
    <path d="M0 10Q0 0 10 0H164Q174 0 174 10V232H0Z" fill="#0e1419" stroke="#465057"/>
    <path d="M1 10Q1 1 10 1H164Q173 1 173 10V31H1Z" fill="#192229"/>
    <circle cx="14" cy="15" r="3" fill="#d5584d"/><circle cx="25" cy="15" r="3" fill="#d8a44c"/><circle cx="36" cy="15" r="3" fill="#72b77e"/>
    <g font-family="Arial, sans-serif">
      <text x="14" y="53" font-size="8" font-weight="700" fill="#f5f2ea">Audio settings</text>
      <text x="14" y="72" font-size="6" letter-spacing="1" fill="#89969a">LIMIT</text><text x="160" y="72" text-anchor="end" font-size="9" font-weight="700" fill="#f5f2ea">-20 dBFS</text>
      <rect x="14" y="84" width="146" height="5" rx="2" fill="#2a363d"/><rect x="14" y="84" width="89" height="5" rx="2" fill="url(#amber)"/><circle cx="103" cy="86.5" r="4" fill="#172027" stroke="#e3b45e"/>
      <text x="14" y="108" font-size="6" fill="#89969a">-60</text><text x="87" y="108" text-anchor="middle" font-size="6" fill="#89969a">-30</text><text x="160" y="108" text-anchor="end" font-size="6" fill="#89969a">0</text>
      <rect x="14" y="125" width="146" height="55" rx="5" fill="#151e24" stroke="#334149"/>
      <text x="25" y="145" font-size="8" font-weight="700" fill="#f5f2ea">Protect every tab</text><text x="25" y="158" font-size="6" fill="#89969a">Smooth peaks automatically</text>
      <rect x="25" y="166" width="64" height="4" rx="2" fill="#d7a044"/><rect x="92" y="166" width="56" height="4" rx="2" fill="#2a363d"/>
    </g>
  </g>
