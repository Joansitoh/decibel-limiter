    <g transform="translate(734 567) scale(1)" color="#ffb375"><path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.75"/><circle cx="17" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="1.75"/></g>
    <text x="772" y="586" font-family="Outfit, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" fill="#f3f4f8">open.spotify.com</text>
    <text x="1000" y="586" font-family="Outfit, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400" fill="rgba(204,204,220,0.75)" text-anchor="end">Music</text>
    <text x="1100" y="586" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="600" fill="#ffb375" text-anchor="end">−12 dB</text>
    <rect x="1112" y="566" width="56" height="26" rx="13" fill="rgba(255,120,10,0.16)"/><text x="1140" y="584" font-family="Outfit, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="650" fill="#ffb375" text-anchor="middle">Saved</text>
    <rect x="712" y="634" width="472" height="62" rx="14" fill="#181b1f" stroke="rgba(204,204,220,0.12)"/>
    <g transform="translate(734 653) scale(1)" color="rgba(204,204,220,0.75)"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.75"/><path fill="none" stroke="currentColor" stroke-width="1.75" d="M3.5 12h17M12 3.5c2.6 2.4 3.8 5.2 3.8 8.5s-1.2 6.1-3.8 8.5c-2.6-2.4-3.8-5.2-3.8-8.5S9.4 5.9 12 3.5z"/></g>
