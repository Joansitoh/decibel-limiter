    <text x="772" y="438" font-family="Outfit, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" fill="#f3f4f8">twitch.tv</text>
    <text x="1000" y="438" font-family="Outfit, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400" fill="rgba(204,204,220,0.75)" text-anchor="end">Night</text>
    <text x="1100" y="438" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="600" fill="#ffb375" text-anchor="end">−26 dB</text>
    <rect x="1112" y="418" width="56" height="26" rx="13" fill="rgba(255,120,10,0.16)"/><text x="1140" y="436" font-family="Outfit, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="650" fill="#ffb375" text-anchor="middle">Saved</text>
    
    <rect x="712" y="474" width="472" height="62" rx="14" fill="#181b1f" stroke="rgba(204,204,220,0.12)"/>
    <g transform="translate(734 493) scale(1)" color="#ffb375"><path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" d="M8 10h.01M12 10h.01M16 10h.01M5 18v-1a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v1"/><circle cx="12" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.75"/></g>
    <text x="772" y="512" font-family="Outfit, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" fill="#f3f4f8">tiktok.com</text>
    <text x="1000" y="512" font-family="Outfit, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400" fill="rgba(204,204,220,0.75)" text-anchor="end">Social</text>
    <text x="1100" y="512" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="600" fill="#ffb375" text-anchor="end">−30 dB</text>
    <rect x="1112" y="492" width="56" height="26" rx="13" fill="rgba(255,120,10,0.16)"/><text x="1140" y="510" font-family="Outfit, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="650" fill="#ffb375" text-anchor="middle">Saved</text>
    
