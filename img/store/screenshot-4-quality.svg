    <text x="1000" y="364" font-family="Outfit, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400" fill="rgba(204,204,220,0.75)" text-anchor="end">Balanced</text>
    <text x="1100" y="364" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="600" fill="#ffb375" text-anchor="end">−20 dB</text>
    <rect x="1112" y="344" width="56" height="26" rx="13" fill="rgba(255,120,10,0.16)"/><text x="1140" y="362" font-family="Outfit, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="650" fill="#ffb375" text-anchor="middle">Saved</text>
    
