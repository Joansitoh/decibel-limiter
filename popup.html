<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="extensionName">Decibel Limiter</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="container">
    <header class="header">
      <div class="header-left">
        <img src="icons/icon128.png" class="header-icon" alt="Icon" />
        <div class="header-text">
          <h1 data-i18n="extensionName">Decibel Limiter</h1>
          <span class="subtitle">Audio limiter for Chrome tabs</span>
        </div>
      </div>

      <a href="https://github.com/Joansitoh" target="_blank" class="github-link" title="GitHub">
        <span class="material-icons">code</span>
      </a>
    </header>

    <div class="card meter-card">
      <div class="section-header">
        <span data-i18n="averageLevel">Average Level</span>
        <span id="averageDB" class="value">-∞ dBFS</span>
      </div>

      <div class="meter-bar">
        <div class="meter-fill" id="meterFill"></div>
      </div>

      <div class="scale-markers">
        <span>-60</span><span>-30</span><span>0 dBFS</span>
      </div>
    </div>

    <div class="card slider-card">
      <div class="section-header">
        <span data-i18n="limit">Limit</span>
        <span id="limitValue" class="value">-20 dBFS</span>
      </div>

      <input type="range" id="limitSlider" min="-60" max="0" step="1" value="-20" />

      <div class="scale-markers">
        <span>-60</span><span>-30</span><span>0</span>
      </div>
    </div>

    <div class="button-row">
      <button id="toggleButton" class="btn main-btn">
        <span class="material-icons">power_settings_new</span>
        <span id="toggleText">Enable</span>
      </button>

      <button id="captureButton" class="btn icon-btn" title="Enhanced Mode">
        <span class="material-icons">mic</span>
      </button>
    </div>

    <footer class="footer" data-i18n="footer">Control the volume of your navigation tabs</footer>
  </div>

  <script src="js/popup.js"></script>
</body>
</html>
